[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licita-ai"
version = "0.1.0"
description = "Ferramentas iniciais para organizar e pesquisar editais públicos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]

[project.scripts]
licita-ai = "licita_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
